<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSAI - Dark GPT</title>
    <meta name="description" content="Advanced hacker-themed AI interface.">
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Highlight.js for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrixBg"></canvas>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="neon-text">NS</span>AI
                </div>
                <button class="new-chat-btn" id="newChatBtn">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Session
                </button>
            </div>
            
            <div class="chat-history">
                <div class="history-item active">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Initialize System
                </div>
                <!-- More history items would go here -->
            </div>

            <div class="sidebar-config" style="padding: 1rem; border-top: 1px solid var(--border-color);">
                <label for="apiKeyInput" style="font-size: 0.8rem; color: var(--text-secondary); display: block; margin-bottom: 0.5rem; font-family: var(--font-mono);">[GEMINI_API_KEY]</label>
                <input type="password" id="apiKeyInput" placeholder="Enter API Key..." style="width: 100%; background: #111; border: 1px solid var(--border-color); color: var(--text-primary); padding: 0.5rem; border-radius: 4px; font-family: var(--font-sans); outline: none;" />
            </div>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <div class="user-name">Guest User</div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="scanline"></div>
            
            <div class="chat-header">
                <h2>System <span class="neon-text">v1.0.0</span></h2>
                <div class="status-indicator">
                    <span class="dot"></span> Online
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <!-- Welcome Message -->
                <div class="message system-message">
                    <div class="message-content">
                        > NSAI Core System Initialized.<br>
                        > Welcome to the interface.<br>
                        > Awaiting user input...
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <!-- Hidden file input for images -->
                    <input type="file" id="fileInput" accept="image/*,.pdf,.csv" style="display: none;" />
                    <!-- Attachment button -->
                    <button id="attachBtn" class="attach-btn" title="Attach Image or File">
                        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>
                    <!-- Mic button -->
                    <button id="micBtn" class="mic-btn" title="Voice Input">
                        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                    <!-- Added padding-left to text area to make room for 2 buttons -->
                    <textarea id="chatInput" placeholder="Enter command, click mic, or attach file..." rows="1"></textarea>
                    <button id="sendBtn" class="send-btn" title="Send Message">
                        <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 mr-1" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="disclaimer">
                    NSAI may produce inaccurate information about people, places, or facts.
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
